openapi: 3.0.0
info:
  title: Tour Management System
  description: >-
    API collection for Tour Management System with comprehensive security
    features, role-based access control, and error handling
  version: 1.0.0
servers:
  - url: http://127.0.0.1:22000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    noauthAuth:
      type: http
      scheme: noauth
tags:
  - name: Authentication
  - name: User Management
    description: Endpoints for managing user accounts with role-based access control
  - name: Error Handling
    description: Examples of error responses and handling
  - name: Tours
  - name: Reviews
  - name: Users
paths:
